<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Office 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ea; }
  canvas { display: block; }
  .bar { position: fixed; top: 16px; left: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  select { appearance: none; -webkit-appearance: none; font: 500 14px/1 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    color: #1f2428; background: rgba(255,255,255,.92); border: 1px solid rgba(0,0,0,.12); border-radius: 999px;
    padding: 10px 34px 10px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.10); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #555 50%), linear-gradient(135deg, #555 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="bar">
  <select id="paint" aria-label="Wall colours"></select>
  <select id="floor" aria-label="Flooring"></select>
  <select id="blinds" aria-label="Outdoor blinds"></select>
  <select id="view" aria-label="View"></select>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// All dimensions in feet. x = across the 11.5 ft width, z = along the 18 ft length (entry wall at z = 18).
const W = 11.5, L = 18, H = 9, AX = 4.9, WZ = 6.6;

const PAINTS = [
  { name: "Warm white + sage", wall: 0xf2ede3, accent: 0x9caf94 },
  { name: "Greige + navy", wall: 0xd9d2c5, accent: 0x2b3a55 },
  { name: "Light grey + charcoal", wall: 0xdcdfe1, accent: 0x3c4044 },
  { name: "Warm white + terracotta", wall: 0xf2ede3, accent: 0xc4704f }
];
const FLOORS = [
  { name: "Tile · warm beige matte", color: 0xd9cbb4, type: "tile" },
  { name: "Tile · light grey matte", color: 0xc6c7c3, type: "tile" },
  { name: "Tile · ivory matte", color: 0xece6da, type: "tile" },
  { name: "Tile · wood-look oak", color: 0xcfae80, type: "plank" }
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ea);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(5.2, 2.2, 9.6);
controls.enableDamping = true;
controls.minDistance = 8; controls.maxDistance = 70; controls.maxPolarAngle = 1.5;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b0a2, 1.5));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.4);
sun.position.set(19, 30, 32); sun.target.position.set(5.5, 0, 15);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 100 });
scene.add(sun, sun.target);

// ---------- helpers ----------
const M = (color, rough = 0.8, metal = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
function B(x0, x1, y0, y1, z0, z1, mat, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function C(r, h, x, y, z, mat, axis = "y", parent = scene, rTop = r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, 28), mat);
  if (axis === "x") m.rotation.z = Math.PI / 2;
  if (axis === "z") m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// Wall from A to B; its visible face points to the left-hand side of A→B rotated so (-dz, dx) is "inside".
function wall(ax, az, bx, bz, mat, holes = [], h = H) {
  const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz);
  const s = new THREE.Shape();
  s.moveTo(0, -0.05); s.lineTo(len, -0.05); s.lineTo(len, h); s.lineTo(0, h); s.closePath();
  holes.forEach(([u0, u1, v0, v1]) => {
    const p = new THREE.Path();
    p.moveTo(u0, v0); p.lineTo(u1, v0); p.lineTo(u1, v1); p.lineTo(u0, v1); p.closePath();
    s.holes.push(p);
  });
  const g = new THREE.Group();
  g.position.set(ax, 0, az); g.rotation.y = Math.atan2(-dz, dx);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), mat);
  m.receiveShadow = true; g.add(m); scene.add(g); return g;
}
const frameMat = M(0xffffff, 0.5);
const glassMat = new THREE.MeshStandardMaterial({ color: 0xbfe3f5, transparent: true, opacity: 0.28, roughness: 0.05,
  metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
function windowIn(g, u0, u1, v0, v1) {
  const t = 0.12, uc = (u0 + u1) / 2, vc = (v0 + v1) / 2, w = u1 - u0, h = v1 - v0;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat); glass.position.set(uc, vc, 0); g.add(glass);
  const bar = (bw, bh, x, y, d = 0.24) => { const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, d), frameMat);
    m.position.set(x, y, 0); g.add(m); };
  bar(w + 2 * t, t, uc, v1 + t / 2); bar(w + 2 * t, t, uc, v0 - t / 2);
  bar(t, h, u0 - t / 2, vc); bar(t, h, u1 + t / 2, vc); bar(0.07, h, uc, vc, 0.1);
  bar(w + 2 * t + 0.2, 0.06, uc, v0 - t - 0.03, 0.5); // sill
}
function canvasTex(draw) {
  const c = document.createElement("canvas"); c.width = c.height = 512;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.25, 0.25); // one tile = 4 ft
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const plankTex = canvasTex(g => {
  for (let i = 0; i < 8; i++) {           // 8 planks of 0.5 ft across, running along the room length
    let y = -rnd() * 300;
    while (y < 512) {
      const len = 300 + rnd() * 212, v = 225 + Math.floor(rnd() * 30);
      g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(i * 64, y, 64, len);
      g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(i * 64, y, 64, 1.5);
      y += len;
    }
    g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(i * 64, 0, 1.5, 512);
  }
});
const tileTex = canvasTex(g => {
  g.fillStyle = "#f4f4f4"; g.fillRect(0, 0, 512, 512);
  g.fillStyle = "rgba(0,0,0,.22)";
  for (let i = 0; i < 2; i++) { g.fillRect(i * 256, 0, 3, 512); g.fillRect(0, i * 256, 512, 3); }
});

// ---------- floor ----------
const floorMat = M(FLOORS[0].color, 0.65, 0, { map: tileTex });
{
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(AX, 0); s.lineTo(AX, -WZ); s.lineTo(W, -WZ); s.lineTo(W, -L); s.lineTo(0, -L); s.closePath();
  const f = new THREE.Mesh(new THREE.ShapeGeometry(s), floorMat);
  f.rotation.x = -Math.PI / 2; f.receiveShadow = true; scene.add(f);
  const wf = new THREE.Mesh(new THREE.PlaneGeometry(W - AX, WZ), M(0x8f9699, 0.6));
  wf.rotation.x = -Math.PI / 2; wf.position.set((AX + W) / 2, -0.01, WZ / 2); wf.receiveShadow = true; scene.add(wf);
}

// ---------- walls, windows, doors ----------
const wallMat = M(PAINTS[0].wall, 0.95);
const wallMat2 = M(PAINTS[0].wall, 0.95, 0, { side: THREE.DoubleSide });
const accentMat = M(PAINTS[0].accent, 0.95);
const washMat = M(0xf4f6f7, 0.6);
const doorMat = M(0x9a6b43, 0.6);
const brass = M(0xc9a24a, 0.35, 0.8);

const leftWall = wall(0, L, 0, 0, accentMat, [[5, 10, 3, 7]]);            // accent wall, window above the desk
windowIn(leftWall, 5, 10, 3, 7);
wall(0, 0, AX, 0, wallMat);                                                // back of the alcove
const washSide = wall(AX, 0, AX, WZ, wallMat2, [[0.4, 2.9, 0, 7]]);        // washroom side wall with its door
{
  const d = new THREE.Mesh(new THREE.BoxGeometry(2.5, 7, 0.12), doorMat); d.position.set(1.65, 3.5, 0); washSide.add(d);
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.3), brass); h.position.set(2.65, 3.3, 0); washSide.add(h);
}
wall(AX, WZ, W, WZ, wallMat2);                                             // washroom front wall
const rightWall = wall(W, WZ, W, L, wallMat, [[3.2, 8.2, 3, 7]]);          // window centred on the open part
windowIn(rightWall, 3.2, 8.2, 3, 7);
const entryWall = wall(W, L, 0, L, wallMat, [[0.25, 3.25, 0, 7]]);         // entry wall with door opening
wall(AX, 0, W, 0, washMat); wall(W, 0, W, WZ, washMat);                    // washroom outer walls
{
  const hinge = new THREE.Group(); hinge.position.set(11.25, 0, L); hinge.rotation.y = -1.3; scene.add(hinge);
  B(-3, 0, 0, 7, -0.07, 0.07, doorMat, hinge);
  B(-2.85, -2.73, 3.1, 3.55, -0.18, 0.18, brass, hinge);
}

// ---------- coffee station (left of the entry door) ----------
const charcoal = M(0x2f3437, 0.7), walnut = M(0x7b5234, 0.55), steel = M(0xc5c9cc, 0.3, 0.85), black = M(0x1c1f22, 0.6);
B(0, 7.75, 0, 2.9, 16.05, L, charcoal);
B(0.1, 7.65, 0, 0.3, 16.0, 16.06, black);
B(0, 7.8, 2.9, 3.02, 15.95, L, walnut);
for (let i = 0; i < 5; i++) {
  if (i) B(i * 1.55 - 0.012, i * 1.55 + 0.012, 0.3, 2.85, 16.035, 16.055, black);
  B(i * 1.55 + 0.12, i * 1.55 + 0.18, 1.9, 2.5, 15.98, 16.05, brass);
}
B(1.0, 1.95, 3.02, 4.25, 16.75, 17.8, steel); B(1.08, 1.87, 3.35, 3.95, 16.72, 16.76, black);   // espresso machine
B(1.05, 1.9, 3.02, 3.1, 16.45, 16.75, black);
C(0.27, 0.7, 3.0, 3.37, 17.2, steel, "y", scene, 0.2); C(0.05, 0.3, 3.0, 3.87, 17.2, black);     // kettle
C(0.2, 0.75, 4.1, 3.4, 17.3, black); C(0.17, 0.4, 4.1, 3.97, 17.3, M(0x8a5a3a, 0.4, 0, { transparent: true, opacity: 0.8 }), "y", scene, 0.26);
B(5.2, 6.9, 3.02, 3.08, 16.6, 17.6, M(0xd8c9a8, 0.8));                                           // tray
[0xe8e4dc, 0x9caf94, 0xc4704f].forEach((c, i) => C(0.13, 0.3, 5.6 + i * 0.45, 3.23, 17.1, M(c, 0.5)));
B(0.5, 7.25, 5.0, 5.09, 17.15, L, walnut);                                                        // wall shelf
[0xe8e4dc, 0x9caf94, 0x2b3a55, 0xc4704f, 0xe8e4dc, 0x3c4044].forEach((c, i) => C(0.13, 0.3, 1.0 + i * 0.5, 5.24, 17.6, M(c, 0.5)));
[5.0, 5.6, 6.2].forEach(x => { C(0.2, 0.55, x, 5.37, 17.6, M(0xdfe9ee, 0.1, 0, { transparent: true, opacity: 0.55 }));
  C(0.19, 0.3, x, 5.25, 17.6, M(0x5a3a22, 0.9)); C(0.21, 0.06, x, 5.67, 17.6, walnut); });

// ---------- washroom: commode, two taps, exhaust fan ----------
{
  const china = M(0xfafafa, 0.25), chrome = M(0xd5d9dc, 0.2, 0.9);
  // Commode and taps sit on the washroom's front (office-side) wall: built against z = 0, then mirrored to z = WZ.
  const fw = new THREE.Group(); fw.position.z = WZ; fw.scale.z = -1; scene.add(fw);
  // Commode against the right (window-side) wall, facing across the washroom.
  const cg = new THREE.Group(); cg.rotation.y = -Math.PI / 2; cg.position.set(W, 0, WZ / 2 - 9.8); scene.add(cg);
  B(9.05, 10.55, 1.2, 2.7, 0.05, 0.7, china, cg); B(9.0, 10.6, 2.7, 2.8, 0.02, 0.75, china, cg);  // cistern
  C(0.07, 0.04, 9.8, 2.82, 0.38, chrome, "y", cg);
  const bowl = C(0.42, 1.3, 9.8, 0.65, 1.5, china, "y", cg, 0.62); bowl.scale.z = 1.25;
  const seat = C(0.65, 0.08, 9.8, 1.34, 1.5, M(0xe9e9e6, 0.4), "y", cg); seat.scale.z = 1.25;
  const tap = (x, y) => {
    C(0.1, 0.05, x, y, 0.03, chrome, "z", fw); C(0.05, 0.36, x, y, 0.2, chrome, "z", fw);
    B(x - 0.04, x + 0.04, y - 0.2, y, 0.33, 0.41, chrome, fw); B(x - 0.13, x + 0.13, y + 0.05, y + 0.09, 0.14, 0.22, chrome, fw);
  };
  tap(8.3, 1.6); tap(6.6, 2.6);
  B(9.2, 10.4, 7.0, 8.2, 0, 0.12, china);                                                          // exhaust fan
  C(0.5, 0.02, 9.8, 7.6, 0.13, M(0x30353a, 0.6), "z");
  [0.6, 2.17].forEach(a => { const g = new THREE.Group(); g.position.set(9.8, 7.6, 0.15); g.rotation.z = a; scene.add(g);
    B(-0.45, 0.45, -0.07, 0.07, 0, 0.02, M(0x8a9198, 0.4, 0.5), g); });
  C(0.12, 0.05, 9.8, 7.6, 0.17, chrome, "z");
}

// ---------- desk (left wall, under the window): 180 x 75 cm electric sit-stand, white ----------
// Work zone on the washroom side, mobile-gaming zone on the door side next to the desk-level sockets.
const deskTop = M(0xf3f2ee, 0.45), deskFrame = M(0xe4e4e1, 0.45, 0.3), darkMetal = M(0x202327, 0.5, 0.6), screen = M(0x0e1114, 0.25, 0.2),
  glow = M(0x24405c, 0.3, 0, { emissive: 0x2c5a85, emissiveIntensity: 0.7 }), alu = M(0xb9bdc2, 0.35, 0.8);
B(0.05, 2.51, 2.46, 2.52, 7.55, 13.45, deskTop);
[[8.1, 8.35], [12.65, 12.9]].forEach(([a, b]) => { B(1.13, 1.4, 0.08, 2.46, a, b, deskFrame); B(0.15, 2.4, 0, 0.08, a, b, deskFrame); });
B(1.16, 1.36, 2.34, 2.46, 8.2, 12.8, deskFrame);
B(2.41, 2.53, 2.39, 2.46, 10.9, 11.4, black);                                                      // height controller
C(0.05, 1.3, 0.3, 3.17, 9.9, darkMetal); B(0.3, 0.5, 3.5, 3.6, 9.85, 9.95, darkMetal);            // monitor arm
B(0.5, 0.58, 3.0, 4.15, 8.9, 10.9, screen); B(0.58, 0.59, 3.05, 4.1, 8.95, 10.85, glow);          // monitor
function laptop(xc, zc) {
  B(xc - 0.35, xc + 0.35, 2.52, 2.56, zc - 0.5, zc + 0.5, alu);
  B(xc - 0.25, xc + 0.2, 2.56, 2.565, zc - 0.42, zc + 0.42, black);
  const g = new THREE.Group(); g.position.set(xc - 0.35, 2.56, zc); g.rotation.z = 0.3; scene.add(g);
  B(-0.015, 0.015, 0, 0.68, -0.5, 0.5, alu, g); B(0.015, 0.02, 0.03, 0.65, -0.47, 0.47, glow, g);
}
laptop(1.55, 9.9); laptop(1.3, 8.4);
[[7.62, 8.0], [11.0, 11.38]].forEach(([a, b]) => { B(0.15, 0.55, 2.52, 3.25, a, b, black);
  C(0.12, 0.02, 0.56, 2.78, (a + b) / 2, alu, "x"); C(0.06, 0.02, 0.56, 3.06, (a + b) / 2, alu, "x"); });
B(1.0, 1.4, 2.52, 2.56, 11.2, 11.8, alu);                                                          // tablet on a stand
{ const g = new THREE.Group(); g.position.set(1.1, 2.56, 11.5); g.rotation.z = 0.3; scene.add(g);
  B(-0.015, 0.015, 0.03, 0.62, -0.42, 0.42, alu, g); B(0.015, 0.02, 0.05, 0.6, -0.4, 0.4, glow, g); }
B(0.75, 1.15, 2.52, 2.56, 12.5, 12.9, alu);                                                        // phone stand
{ const g = new THREE.Group(); g.position.set(0.87, 2.56, 12.7); g.rotation.z = 0.3; scene.add(g);
  B(-0.015, 0.015, 0.12, 0.42, -0.3, 0.3, screen, g); B(0.015, 0.02, 0.14, 0.4, -0.28, 0.28, glow, g);
  B(-0.12, -0.015, 0.16, 0.38, -0.11, 0.11, black, g);                                             // clip-on cooling fan
  C(0.08, 0.01, -0.125, 0.27, 0, M(0x1d6f7a, 0.3, 0, { emissive: 0x29c4d6, emissiveIntensity: 0.9 }), "x", g); }
B(0.08, 0.8, 2.522, 2.535, 13.02, 13.04, black); B(0.08, 0.1, 2.522, 2.85, 13.02, 13.3, black);    // charger cable to the wall socket
B(1.5, 2.05, 2.52, 2.58, 12.1, 13.05, black);                                                      // gaming keyboard
B(1.62, 1.84, 2.52, 2.6, 13.14, 13.3, black);                                                      // mouse

// ---------- chair: mesh back, headrest, lumbar massager, polished aluminium base ----------
{
  const ch = new THREE.Group(); ch.position.set(3.3, 0, 10.1); scene.add(ch);
  const fabric = M(0x26292d, 0.95), frame = M(0x1c1f22, 0.5, 0.4), polished = M(0xd0d4d8, 0.25, 0.9);
  const mesh = M(0x2b2f33, 0.9, 0, { transparent: true, opacity: 0.82 });
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2, s = new THREE.Group(); s.rotation.y = a; ch.add(s);
    B(0, 0.95, 0.18, 0.26, -0.06, 0.06, polished, s);
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), frame); w.position.set(0.92, 0.1, 0); w.castShadow = true; s.add(w);
  }
  C(0.07, 1.15, 0, 0.82, 0, polished, "y", ch);
  B(-0.8, 0.75, 1.42, 1.65, -0.8, 0.8, fabric, ch);
  const back = new THREE.Group(); back.position.set(0.72, 1.62, 0); back.rotation.z = -0.13; ch.add(back);
  B(-0.03, 0.03, 0.15, 2.05, -0.75, 0.75, mesh, back);
  [-0.77, 0.77].forEach(z => B(-0.05, 0.05, 0.1, 2.1, z - 0.04, z + 0.04, frame, back));
  B(-0.05, 0.05, 2.05, 2.13, -0.8, 0.8, frame, back);
  B(0.03, 0.12, 0.1, 2.3, -0.07, 0.07, frame, back);                                               // spine
  B(-0.2, -0.03, 0.3, 0.85, -0.55, 0.55, M(0x3d4349, 0.8), back);                                  // lumbar massager
  B(-0.14, -0.02, 2.35, 2.8, -0.45, 0.45, fabric, back);                                           // headrest
  [-0.92, 0.92].forEach(z => { B(-0.05, 0.05, 1.55, 2.25, z - 0.04, z + 0.04, frame, ch); B(-0.5, 0.4, 2.25, 2.33, z - 0.12, z + 0.12, frame, ch); });
}

// ---------- printer rack (alcove beside the washroom) ----------
const shelfWood = M(0xb98c5a, 0.7);
[[0.05, 0.3], [0.05, 5.3], [1.95, 0.3], [1.95, 5.3]].forEach(([x, z]) => B(x - 0.05, x + 0.05, 0, 3.04, z - 0.05, z + 0.05, darkMetal));
[0.45, 1.7, 2.97].forEach(y => B(0, 2, y, y + 0.07, 0.25, 5.35, shelfWood));
B(0.3, 1.7, 3.04, 3.2, 0.5, 1.9, black);                                                           // 3D printer
[0.35, 1.55].forEach(x => B(x, x + 0.1, 3.2, 4.6, 1.15, 1.25, darkMetal));
B(0.35, 1.65, 4.5, 4.6, 1.15, 1.25, darkMetal); B(0.35, 1.65, 3.95, 4.02, 1.17, 1.23, alu);
B(0.5, 1.5, 3.22, 3.26, 0.7, 1.7, alu); B(0.9, 1.1, 3.88, 4.1, 1.03, 1.25, M(0xe2632a, 0.5));

{

}
